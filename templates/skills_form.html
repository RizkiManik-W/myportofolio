{% extends "base.html" %}

{% block meta %}
    <title>Add Skill - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="skills-section">
        <div class="container">
            <h1>Add Skill</h1>

            <form method="post" class="skill-form">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="button">
                    Add Skill
                </button>

                <a href="{% url 'main:show_skills' %}" class="button button-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
